    <rect x="1000" y="188" width="144" height="58" rx="10" fill="#102C2C" stroke="#407D6B"/>
  </g>
  <text x="1017" y="212" fill="#75E1BC" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">SOURCE EVIDENCE</text>
  <text x="1017" y="231" fill="#9FB5BC" font-family="Segoe UI,Arial,sans-serif" font-size="12">document / page / chunk</text>
  <text x="800" y="237" fill="#607D89" font-family="Segoe UI,Arial,sans-serif" font-size="12">PARSE → RETRIEVE → CITE</text>
